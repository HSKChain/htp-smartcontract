[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"
fs_permissions = [
  { access = "read", path = "../schema/v1/vectors/calculators" },
  { access = "read", path = "../schema/v1/vectors/fees" },
  { access = "read", path = "../deploy" },
  { access = "read-write", path = "../deploy/out" },
  { access = "read", path = "./test/fixtures" },
]

# Solidity 0.8.36 resolves to the immutable
# 0.8.36+commit.8a079791 compiler release.
solc = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false

bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = true
build_info = true
ast = true
extra_output = ["metadata", "storageLayout"]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
auto_detect_remappings = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true
